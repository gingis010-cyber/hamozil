<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0; box-sizing:border-box}
  html,body{overflow:hidden}
  body{background:#F7F4EE; font-family:'Assistant',Arial,sans-serif}

  /* מסגרת סגורה: אלמנט שחורג ממנה לא ירחיב את פריסת ה-RTL,
     ולכן התמונה לא נחתכת בצד. */
  .card{
    width:1200px; height:630px; background:#F7F4EE; color:#14201D;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:9px;
    background:linear-gradient(90deg,#0D6B54,#C08A1E);
  }
  .glow{
    position:absolute; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle,rgba(13,107,84,.10) 0%,rgba(13,107,84,0) 70%);
    top:-230px; right:-160px;
  }
  .mark{width:186px; height:186px; display:block; position:relative}
  .name{
    font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:82px;
    line-height:1.1; margin-top:30px; position:relative; letter-spacing:-1px;
  }
  .tag{font-size:36px; font-weight:700; color:#0D6B54; margin-top:12px; position:relative}
  .rule{width:170px; height:3px; background:#C08A1E; border-radius:2px; margin-top:30px; opacity:.75}
  .who{font-size:26px; font-weight:600; color:#5D6B66; margin-top:22px; position:relative}
</style>
</head>
<body>
 <div class="card">
  <div class="glow"></div>

  <svg class="mark" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#0D6B54"/>
    <text x="40" y="45" font-family="Assistant,Arial,Helvetica,sans-serif" font-size="38"
          font-weight="700" fill="#ffffff" text-anchor="middle">&#8362;</text>
    <path d="M19 26 L19 40 M14.5 35 L19 40.5 L23.5 35" fill="none" stroke="#C08A1E"
          stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="name">קבוצת המוזיל</div>
  <div class="tag">מתאגדים ומשלמים פחות</div>
  <div class="rule"></div>
  <div class="who">לעסקים ולמשקי בית</div>
 </div>
</body>
</html>
