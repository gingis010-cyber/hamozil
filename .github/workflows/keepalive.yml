# מונע מהפרויקט ב-Supabase להירדם.
#
# בתוכנית החינמית פרויקט שלא נגעו בו שבוע מושהה, ואז כל הרשמה חדשה
# נופלת בשקט. הריצה היומית הזו מבצעת שאילתה אמיתית מול מסד הנתונים
# ומאפסת את השעון. היא רצה על השרתים של GitHub — לא תלויה במחשב
# ולא בכך שמערכת ההזמנות בשימוש באותו שבוע.
name: keepalive

on:
  schedule:
    - cron: '17 6 * * *'   # כל יום ב-06:17 UTC
  workflow_dispatch:        # אפשר גם להריץ ידנית

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: שאילתה מול מסד הנתונים
        run: |
          # המפתח הוא anon בלבד, והוא ממילא גלוי בקוד המקור של הדף.
          KEY=$(curl -sf https://gingis010-cyber.github.io/hamozil/ \
                | grep -oE "eyJ[A-Za-z0-9._-]{60,}" | head -1)
          if [ -z "$KEY" ]; then echo "לא נמצא מפתח בדף"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://wcufbluejqrywnbkjigv.supabase.co/rest/v1/hamozil_ping?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "תגובה: $CODE"
          [ "$CODE" = "200" ] || exit 1
